name: Build APK

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Compile Rust Shared Library with cargo-ndk
        run: |
          # Auto-locate directory containing Cargo.toml
          CARGO_PATH=$(find . -maxdepth 3 -name "Cargo.toml" | head -n 1)
          if [ -z "$CARGO_PATH" ]; then
            echo "ERROR: Cargo.toml not found! Current directory tree:"
            ls -la
            exit 1
          fi
          PROJECT_DIR=$(dirname "$CARGO_PATH")
          echo "Building in: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          cargo ndk -t aarch64-linux-android -o ./android/app/src/main/jniLibs build --release
          cargo ndk -t armv7-linux-androideabi -o ./android/app/src/main/jniLibs build --release

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK with Gradle
        run: |
          CARGO_PATH=$(find . -maxdepth 3 -name "Cargo.toml" | head -n 1)
          if [ -z "$CARGO_PATH" ]; then
            echo "ERROR: Cargo.toml not found."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$CARGO_PATH")
          cd "$PROJECT_DIR/android"
          gradle --no-daemon assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-mobile-music-player-apk
          path: |
            **/build/outputs/apk/release/*.apk
            **/build/outputs/apk/debug/*.apk