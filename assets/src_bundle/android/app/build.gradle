plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rust.musicplayer'
    compileSdk 34

    defaultConfig {
        applicationId "com.rust.musicplayer"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

dependencies {
    // NativeActivity requires zero external java dependencies
}
